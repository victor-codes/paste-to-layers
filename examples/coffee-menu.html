<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Coffee menu</title>
  <style>
    :root { --ink: #1b1b1b; --muted: #6b6b6b; --accent: oklch(0.6 0.15 40); }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); background: #faf7f2; padding: 32px; width: 640px; }
    h1 { font-size: 28px; letter-spacing: -0.02em; margin-bottom: 20px; }
    .menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .item { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); display: flex; flex-direction: column; gap: 4px; }
    .item h2 { font-size: 18px; }
    .item p { color: var(--muted); font-size: 14px; }
    .price { color: var(--accent); font-weight: 600; }
    .item:hover { transform: translateY(-2px); }
    @media (max-width: 600px) { .menu { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Today's coffee</h1>
  <div class="menu">
    <div class="item">
      <h2>Flat white</h2>
      <p>Double shot, <em>silky</em> milk. <span class="price">$4.50</span></p>
    </div>
    <div class="item">
      <h2>Cortado</h2>
      <p>Equal parts espresso &amp; milk. <span class="price">$4.00</span></p>
    </div>
  </div>
</body>
</html>
